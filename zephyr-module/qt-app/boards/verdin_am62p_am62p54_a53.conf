# Toradex Verdin AM62P (TI AM62P, Cortex-A53) with the DSI panel through
# the SafeUI DSS/DSI/SN65DSI83 drivers (slint-safe-ui-zephyr-verdin-am62p,
# which also provides the board) and OpenGL ES 2.0 on the PowerVR BXS-4-64
# through YakoGL (powervr-bxs-am62p + its yakogl/ submodule).  Both
# repositories must be on ZEPHYR_EXTRA_MODULES next to this module, and
# QT_ZEPHYR_PREFIX must point at a build-qt-zephyr-am62p.sh install.
# Auto-merged into prj.conf when BOARD=verdin_am62p/am62p54/a53.

# The libc Stage 1 (build-qt-zephyr-am62p.sh) was built against: the
# AArch64 Zephyr SDK ships picolibc only.
CONFIG_PICOLIBC=y
CONFIG_NEWLIB_LIBC=n

# GPU + GL.
CONFIG_SAFEUI_GPU_PVR=y
CONFIG_YAKOGL=y
CONFIG_QT_OPENGL=y
CONFIG_QT_DISPLAY_AM62P_DSS=y
CONFIG_QT_DSS_WIDTH=1024
CONFIG_QT_DSS_HEIGHT=600
CONFIG_QT_SCANOUT_BUFFERS=3
CONFIG_CACHE_MANAGEMENT=y

# Memory: QtQuick + V4 + the scene graph + FreeType + YakoGL's object
# tables.  Qt allocates through malloc (picolibc's common arena); Zephyr's
# own k_malloc pool is small.  The image sits in the 408 MB A53 DDR
# section, so the arena and the 3 x 2.4 MB scan-out buffers fit easily.
# Kernel virtual address space: the board defconfig's 256 MB covered a Qt
# Quick image (about 180 MB of RAM footprint with the 128 MB malloc arena)
# plus the GPU driver's 64 MB carveout mapping (k_mem_map_phys_bare), but a
# Qt Quick 3D image is about 200 MB and the mapping then failed with
# "insufficient virtual address space" -> kernel panic at GPU bring-up
# (2026-09-17). 512 MB leaves room for both and for larger arenas.
CONFIG_KERNEL_VM_SIZE=0x20000000
CONFIG_COMMON_LIBC_MALLOC=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=134217728
CONFIG_HEAP_MEM_POOL_SIZE=4194304

# Stacks: V4 + QPainter + FreeType + the GL core (struct pvr_draw on the
# stack) on the main thread; C++ static initialisers on the idle/ISR side.
CONFIG_MAIN_STACK_SIZE=1048576
CONFIG_ISR_STACK_SIZE=8192
CONFIG_IDLE_STACK_SIZE=4096

# Init order (same as the GPU driver samples): mailbox 40 -> TISCI 45 ->
# TISCI power-on 46 -> GPIO 47 -> I2C 50 -> DSI 70 -> DSS 80 -> GPU 90 ->
# panel bridge 95.
CONFIG_MBOX=y
CONFIG_MBOX_TI_SECURE_PROXY=y
CONFIG_TISCI=y
CONFIG_TISCI_INIT_PRIORITY=45
CONFIG_GPIO_INIT_PRIORITY=47
CONFIG_SAFEUI_PANEL_SN65DSI83_INIT_PRIORITY=95

# Entered from Torizon Linux with tools/kexec-zephyr: the main RTI
# watchdog Linux left running cannot be stopped, so it is fed -- for a
# BOUNDED time, so a hung image is reset back into Linux (nothing can
# power-cycle the lab board remotely).  A crash resets immediately
# (CONFIG_QT_RESET_ON_FATAL); this bound only covers a silent hang and ends
# a bring-up run so the next image can be booted (the RTI period is 60 s, so
# the reset lands within a minute after the bound).  Raise
# it on the west command line for a long demo session
# (-DCONFIG_SOC_AM62PX_A53_FEED_INHERITED_WDT_SECONDS=3600); never set 0
# (forever) on a kexec image.
CONFIG_SOC_AM62PX_A53_FEED_INHERITED_WDT=y
CONFIG_SOC_AM62PX_A53_FEED_INHERITED_WDT_SECONDS=120
CONFIG_REBOOT=y

# Console on main_uart0 (Verdin UART_3); DDR does not survive the reset,
# so a RAM console would be useless.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y

# CPU load in the keep-alive beat ("[hb] cpu busy N%"): tells a CPU-bound
# frame rate from one waiting on the GPU (2026-09-17, Quick 3D performance).
CONFIG_SCHED_THREAD_USAGE=y
CONFIG_SCHED_THREAD_USAGE_ALL=y
