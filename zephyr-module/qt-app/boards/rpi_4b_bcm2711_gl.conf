# Raspberry Pi 4 with OpenGL ES 2.0 on the V3D through YakoGL (issue #9).
# Not merged automatically (the name has a suffix): add it after the board's
# own settings,
#   -DEXTRA_CONF_FILE=<this file> -DEXTRA_DTC_OVERLAY_FILE=<the .overlay>
# and put YakoGL on ZEPHYR_EXTRA_MODULES next to this module.  QT_ZEPHYR_PREFIX
# must point at a build-qt-zephyr-rpi4.sh install made with GL on.
# tools/west-build-rpi4.sh does all this and checks the pinned commits.
#
# The V3D settings are those of YakoGL's glmark2 sample for the Pi 4
# (driver/samples/zephyr/glmark2/boards/rpi_4b.conf): 96 MiB of GPU memory,
# the texture formatting unit, FPU sharing, enough translation tables for the
# carve-out's non-cacheable alias.
CONFIG_YAKOGL=y
CONFIG_YAKOGL_GPU_V3D=y
CONFIG_YAKOGL_V3D_CARVEOUT_BYTES=100663296
CONFIG_YAKOGL_V3D_TILED_COPIES_BYTES=25165824
CONFIG_YAKOGL_V3D_TFU=y
CONFIG_FPU_SHARING=y
CONFIG_MAX_XLAT_TABLES=192

CONFIG_QT_OPENGL=y
CONFIG_QT_DISPLAY_RPI4_V3D=y
CONFIG_QT_SCANOUT_BUFFERS=3

# The framebuffer comes from YakoGL's mailbox code, not from Zephyr's driver.
# Zephyr's raspberrypi firmware driver (which the power-domain driver would
# select) must go with it; see the overlay.
CONFIG_DISPLAY=n
CONFIG_POWER_DOMAIN_RASPBERRYPI_BCM283X=n

# The software backend of the board's own settings does not apply.
CONFIG_QT_ENV=""
