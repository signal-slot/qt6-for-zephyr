# ILI2132A touch on the Verdin AM62P DSI display (with the _touch.overlay).
CONFIG_I2C=y
CONFIG_INPUT=y
CONFIG_INPUT_ILI2132A=y
# QApplication::notify() runs on Zephyr's input thread otherwise (see
# src/qzephyr_touch_zephyr.cpp): events are queued to the main thread, but
# the callback itself still needs more than the 1 KB default.
CONFIG_INPUT_THREAD_STACK_SIZE=32768
