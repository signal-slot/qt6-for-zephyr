# Raspberry Pi 4 (BCM2711, Cortex-A72) with the firmware framebuffer
# (zephyr,display = &fb0, display_rpi_bcm2711_fb.c) driven through the Zephyr
# display API.  Raster only: there is no GPU driver, so Qt draws with the CPU.
# QT_ZEPHYR_PREFIX must point at a build-qt-zephyr-rpi4.sh install.
# Auto-merged into prj.conf when BOARD=rpi_4b/bcm2711.

# The AArch64 Zephyr SDK ships picolibc only (Stage 1 was built against it).
CONFIG_PICOLIBC=y
CONFIG_NEWLIB_LIBC=n

# The subsystems the board devicetree relies on.  The drivers themselves
# (the firmware framebuffer behind zephyr,display = &fb0, the iProc RNG200
# behind zephyr,entropy) default to y once their subsystem is on.  Without
# CONFIG_DISPLAY / CONFIG_ENTROPY_GENERATOR the link fails with undefined
# __device_dts_ord_* (Qt's display glue, and the POSIX getentropy() that
# Zephyr's c_lib_ext provides, use the chosen devices).
CONFIG_DISPLAY=y
CONFIG_ENTROPY_GENERATOR=y

# No GL (Stage 1 was built with OpenGL off); the display glue is the default
# QT_DISPLAY_ZEPHYR_API (display_write on the chosen zephyr,display).
CONFIG_QT_OPENGL=n
CONFIG_QT_ENV="QT_QUICK_BACKEND=software"

# Memory: the overlay gives dram0 512 MiB.  Kernel virtual address space must
# cover the image; with the default (16 MiB) a large image panics at boot in
# k_mem_map_phys_bare (measured on the board with a 256 MiB test image: it
# booted with CONFIG_KERNEL_VM_SIZE=0x30000000).  Starting values for the
# malloc arena and stacks follow the other AArch64 boards; not tuned for Qt.
CONFIG_KERNEL_VM_SIZE=0x30000000
CONFIG_COMMON_LIBC_MALLOC=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=67108864
CONFIG_HEAP_MEM_POOL_SIZE=4194304

CONFIG_MAIN_STACK_SIZE=1048576
CONFIG_ISR_STACK_SIZE=8192
CONFIG_IDLE_STACK_SIZE=4096
