# RT1170-EVKB + RK055HDMIPI4MA0 MIPI-DSI panel + GT911 capacitive
# touch.  This file is auto-merged into prj.conf when
# BOARD=mimxrt1170_evk@<rev>/mimxrt1176/cm7.

# Display + GT911 touch from the rk055hdmipi4ma0 shield.
CONFIG_DISPLAY=y
CONFIG_INPUT=y
CONFIG_INPUT_THREAD_STACK_SIZE=32768

# PXP double-buffered DMA + hardware 90-degree rotation -- needed for
# clean (non-tearing) scan-out of the rotating panel.
CONFIG_DMA=y
CONFIG_MCUX_ELCDIF_PXP=y
CONFIG_MCUX_ELCDIF_PXP_ROTATE_90=y

# Memory sized for QtQuick + V4 + SVG renderer + scene-graph + the
# 1280x720 RGB16 framebuffer.
CONFIG_HEAP_MEM_POOL_SIZE=16777216
CONFIG_NEWLIB_LIBC_ALIGNED_HEAP_SIZE=16777216

# Stage 2 needs a bigger main stack for V4 + QPainter + FreeType.
CONFIG_MAIN_STACK_SIZE=524288

# Bigger ISR + idle stack -- otherwise C++ static initializers of the
# QML plugin chain overflow the default 2 KB region during boot.
CONFIG_ISR_STACK_SIZE=8192
CONFIG_IDLE_STACK_SIZE=4096
