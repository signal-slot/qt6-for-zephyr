# Toradex Verdin iMX8M Plus (Cortex-A53) with its DSI panel driven directly by
# the A53 through the YakoGL driver repository's imx8mp_display (LCDIF ->
# MIPI DSIM -> SN65DSI84), and the GC7000UL through YakoGL. The SafeUI M7 is
# not used. The YakoGL repository (root and driver/) and the SafeUI
# repository (the board's A53 target) must be on ZEPHYR_EXTRA_MODULES next to
# this module, and QT_ZEPHYR_PREFIX must point at a Stage 1 install (the
# AArch64 Stage 1 is board-independent). Auto-merged into prj.conf when
# BOARD=verdin_imx8mp/mimx8ml8/a53.
#
# Milestone 1 is the raster path (QtWidgets / QPainter). OpenGL is linked
# because Stage 1 was built with it, but Qt draws with the CPU.

CONFIG_PICOLIBC=y
CONFIG_NEWLIB_LIBC=n

# GPU + GL present (Stage 1 references them); Qt Quick on GL is milestone 2.
CONFIG_SAFEUI_GPU_VIVANTE=y
CONFIG_YAKOGL=y
CONFIG_YAKOGL_GPU_VIVANTE=y
CONFIG_QT_OPENGL=n

# The display: the A53 owns the panel.
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_PINCTRL=y
CONFIG_SAFEUI_DISPLAY_IMX8MP=y
CONFIG_QT_DISPLAY_IMX8MP=y
CONFIG_QT_IMX8MP_WIDTH=1280
CONFIG_QT_IMX8MP_HEIGHT=800
CONFIG_QT_SCANOUT_BUFFERS=3
CONFIG_CACHE_MANAGEMENT=y

# Board support for an image kexec'd out of Linux (yakogl_gc_board): the GIC
# EOI-mode fix, the interrupt guard, the inherited WDOG1 fed from a timer for
# a BOUNDED time (then the SoC resets back into Linux: nothing can reset the
# lab board remotely), the fatal handler and the SNVS result record. No panel
# console: the panel is Qt's.
CONFIG_YAKOGL_GC_BOARD=y
CONFIG_GC_SAMPLE_WDOG_TIMER_FEED=y
CONFIG_GC_SAMPLE_WDOG_TIMER_CAP_S=300
CONFIG_GC_COMMON_PANEL_CONSOLE=n

# Memory: the image and the 256 MiB crash window it is loaded into.
CONFIG_KERNEL_VM_SIZE=0x40000000
CONFIG_COMMON_LIBC_MALLOC=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=67108864
CONFIG_HEAP_MEM_POOL_SIZE=4194304

CONFIG_MAIN_STACK_SIZE=1048576
CONFIG_ISR_STACK_SIZE=8192
CONFIG_IDLE_STACK_SIZE=4096

CONFIG_REBOOT=y
CONFIG_PM_CPU_OPS=y
CONFIG_PM_CPU_OPS_PSCI=y

# No UART on the Mallow carrier: results travel in the SNVS record.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_UART_CONSOLE=n
CONFIG_FS_LOG_LEVEL_OFF=y
# prj.conf asks for stdout on the console; there is no console driver here.
CONFIG_STDOUT_CONSOLE=n
