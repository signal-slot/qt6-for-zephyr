# Generic Qt-on-Zephyr baseline.  Per-board prj.conf is automatically
# merged from boards/<board>.conf below -- put SoC-specific things
# (display, touch, PXP, memory, stack sizes) there.

# Activate the Qt module and which optional subsets the app needs.
# Override these from -DCONFIG_QT_*=n on the command line if you only
# want CONFIG_QT_GUI without QML, etc.
CONFIG_QT=y
CONFIG_QT_GUI=y
CONFIG_QT_QML=y
CONFIG_QT_QUICK_CONTROLS=y
CONFIG_QT_SVG=y
CONFIG_QT_EMBEDDED_ROBOTO_FONT=y

# C++ / POSIX baseline that Stage 1 (the Cortex-M7 cross-build of
# qtbase) was ABI-fixed against.  Diverging here would mismatch the
# static archives in QT_ZEPHYR_PREFIX.
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_CPP_EXCEPTIONS=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_CPP_RTTI=y
CONFIG_PICOLIBC=n
CONFIG_NEWLIB_LIBC=y
CONFIG_POSIX_API=y
CONFIG_FPU=y

# Console.
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y
